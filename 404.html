<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Pin not connected · Clement Poon</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --paper:#fff; --paper-2:#f4f5f7; --ink:#121417; --ink-3:#626a73; --rule:#b4bac1; --accent:#c8102e; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#0e1115; --paper-2:#151a20; --ink:#e7ebef; --ink-3:#8c959f; --rule:#3a434d; --accent:#ff5d70; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--paper); color: var(--ink); border-top: 4px solid var(--ink);
    font: 16px/1.6 "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { max-width: 520px; width: 100%; }
  .code { margin: 0 0 6px; color: var(--accent); font: 600 0.8rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; }
  h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.4rem); line-height: 1.1; }
  table { width: 100%; border-collapse: collapse; margin: 18px 0 22px; font-size: 0.9rem; }
  th, td { border: 1px solid var(--rule); padding: 7px 10px; text-align: left; }
  th { background: var(--paper-2); font: 600 0.72rem/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  a { display: inline-block; padding: 10px 16px; border-radius: 3px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) { a { color: #14060a; } }
  p { color: var(--ink-3); margin: 0; }
</style>
</head>
<body>
<main>
  <p class="code">ERROR 404</p>
  <h1>This pin is not connected.</h1>
  <p>The page you asked for doesn't exist on this datasheet.</p>
  <table>
    <thead><tr><th scope="col">Pin</th><th scope="col">No.</th><th scope="col">Description</th></tr></thead>
    <tbody><tr><td>NC</td><td>9</td><td>No internal connection. Leave floating.</td></tr></tbody>
  </table>
  <a id="home" href="/">Back to the portfolio</a>
</main>
<script>
  /* Missing pages under /photography send people back to the photos, not the engineering portfolio. */
  if (location.pathname.indexOf("/photography") === 0) {
    var home = document.getElementById("home");
    home.href = "/photography/";
    home.textContent = "Back to the photos";
  }
</script>
</body>
</html>
